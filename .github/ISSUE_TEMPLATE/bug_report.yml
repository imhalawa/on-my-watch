name: Bug report
description: Something broke or behaves wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Remove anything private before you submit: service names, queries, repository names, URLs.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /watch
        2. Press ↻ in Watch
        3. ...
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Linux, Windows]
    validations:
      required: true
  - type: dropdown
    id: pane
    attributes:
      label: Where
      options: [Watch, Pull requests, Config, History, Scheduled runs, Notifications, configure skill, Other]
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Claude Code, on-my-watch, Python, pup and gh.
      placeholder: "claude 2.x, on-my-watch 0.1.0, python 3.12, pup 1.x, gh 2.x"
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The last lines of ~/.on-my-watch/run.log, or the error the pane showed.
      render: text
  - type: textarea
    id: config
    attributes:
      label: Config
      description: The part of ~/.on-my-watch/config.json that matters, with private values replaced.
      render: json
