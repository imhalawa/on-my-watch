name: Feature request
description: An idea that would make on-my-watch more useful.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
